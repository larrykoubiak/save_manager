[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2-save-manager"
dynamic = ["version"]
description = "Web-based device inventory and safe memory-card save transfers"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = ["waitress>=3.0.2,<4", "Pillow>=10.4,<13"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]

[project.scripts]
save-manager = "save_web.__main__:main"
ps2-save-manager = "save_web.__main__:main"
ps2-save-report = "save_core.compare_saves:main"
save-manager-web = "save_web.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "save_core.app_info.__version__"}

[tool.setuptools.packages.find]
include = [
  "save_core",
  "save_web",
  "game_plugins",
  "vendor.mymcplusplus.mymcplusplus",
  "vendor.mymcplusplus.mymcplusplus.save",
]
namespaces = true

[tool.setuptools.package-data]
game_plugins = ["README.md"]
save_web = ["static/*.html", "static/*.css", "static/*.js"]
