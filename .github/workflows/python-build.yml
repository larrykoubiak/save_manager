name: Test and build Save Manager

on:
  push:
    branches: [main]
    tags: ['v0.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application
        run: python -m pip install .
      - name: Test application
        run: python -m unittest discover -s tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install build
      - name: Build application distributions
        run: python -m build
      - name: Verify installed entry point
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          ps2-save-report --version
          save-manager --version
          save-manager-web --version
          python -c "from importlib.resources import files; assert files('save_web').joinpath('static/index.html').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: ps2-save-manager
          path: dist/*

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container and validate Compose
        run: |
          docker compose config --quiet
          docker build -t save-manager:ci .
      - name: Check non-root web service
        run: |
          docker run -d --name save-manager-ci -p 127.0.0.1:8080:8080 --tmpfs /data:uid=10001,gid=10001 save-manager:ci
          docker exec save-manager-ci python -c "import os; assert os.getuid() == 10001"
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen
          for attempt in range(30):
              try:
                  with urlopen('http://127.0.0.1:8080/healthz', timeout=1) as response:
                      assert json.load(response)['status'] == 'ok'
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Container did not become ready')
          with urlopen('http://127.0.0.1:8080/api/inventory') as response:
              assert json.load(response)['devices'] == []
          with urlopen('http://127.0.0.1:8080/') as response:
              assert b'Save Manager' in response.read()
          PY
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs save-manager-ci || true
          docker rm -f save-manager-ci || true
